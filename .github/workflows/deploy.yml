name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once (the service is stopped/started per deploy).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no floating major tag
      - run: uv sync --frozen
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v7

      # Access key of the ride-sharing-github-deploy IAM user (infra/github_deploy.tf).
      # The AWS project's managed SCP blocks OIDC providers, so no keyless login.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      # Start from the latest registered revision so settings changed in
      # Terraform (env vars, CPU, volumes...) ship with this deploy.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
