name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no floating major tag
      - run: uv sync --frozen
      - run: uv run pytest

  deploy:
    needs: test
    # The server is Graviton (arm64): build the images natively on arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      APP_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # Access key of the ride-sharing-github-deploy IAM user (infra/github_deploy.tf).
      # The AWS project's managed SCP blocks OIDC providers, so no keyless login.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        run: |
          docker build -t "$APP_IMAGE" .
          docker push "$APP_IMAGE"

      # Tagged by the content of deploy/caddy/, so the proxy is only rebuilt
      # (and restarted on the server) when its Dockerfile or Caddyfile change.
      - name: Build and push proxy image if changed
        id: proxy
        run: |
          REPO_URL="${{ vars.ECR_PROXY_REPOSITORY_URL }}"
          TAG="caddy-$(git ls-files -s deploy/caddy | sha256sum | cut -c1-16)"
          IMAGE="$REPO_URL:$TAG"
          if aws ecr describe-images --repository-name "${REPO_URL#*/}" --image-ids "imageTag=$TAG" > /dev/null 2>&1; then
            echo "Proxy image $TAG already in ECR"
          else
            docker build -t "$IMAGE" deploy/caddy
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy on the server
        env:
          PROXY_IMAGE: ${{ steps.proxy.outputs.image }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.SERVER_NAME }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ]; then echo "::error::No running server tagged Name=${{ vars.SERVER_NAME }}"; exit 1; fi

          ENV_FILE=$(printf 'APP_IMAGE=%s\nPROXY_IMAGE=%s\nSITE_ADDRESS=%s\nAWS_REGION=%s\nLOG_GROUP=%s\n' \
            "$APP_IMAGE" "$PROXY_IMAGE" "${{ vars.SITE_ADDRESS }}" "${{ vars.AWS_REGION }}" "${{ vars.LOG_GROUP }}")
          # Files travel base64-encoded inside the SSM command.
          PARAMS=$(jq -n \
            --arg compose "$(base64 -w0 deploy/compose.yaml)" \
            --arg script "$(base64 -w0 deploy/deploy.sh)" \
            --arg env "$(printf '%s' "$ENV_FILE" | base64 -w0)" \
            '{commands: [
                "set -eu",
                "mkdir -p /opt/ride-sharing && cd /opt/ride-sharing",
                "echo \($compose) | base64 -d > compose.yaml",
                "echo \($env) | base64 -d > .env",
                "echo \($script) | base64 -d > deploy.sh",
                "bash deploy.sh"
              ],
              executionTimeout: ["900"]}')

          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "SSM command $CMD_ID on $INSTANCE_ID"

          while :; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2> /dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; esac
            break
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $STATUS"
          [ "$STATUS" = Success ]
