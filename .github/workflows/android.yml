name: Android app

# Builds the Android app (mobile/android/): the site as a Trusted Web Activity, generated and
# built by Bubblewrap from twa-manifest.json. On a pull request that changes it, with a throwaway
# key, to check that it still builds. By hand (Actions -> Android app -> Run workflow), signed
# with the upload key from the repository's secrets: the bundle to upload to Google Play is the
# run's artifact. See mobile/android/README.md.
on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli
          # Bubblewrap looks for the SDK's tools where its own download puts them (<sdk>/bin).
          [ -e "$ANDROID_HOME/bin" ] || [ -e "$ANDROID_HOME/tools" ] \
            || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          bubblewrap --version || true
      - name: The signing key
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$KEYSTORE" ] || [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
              echo "::error::The secrets ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are not set: run mobile/android/make-upload-key.sh --github (see mobile/android/README.md)"
              exit 1
            fi
            printf '%s' "$KEYSTORE" | base64 --decode > android.keystore
            echo "SIGNED_WITH=the upload key" >> "$GITHUB_ENV"
          else
            # A pull request: a key made for this run, as make-upload-key.sh makes the real one.
            ./make-upload-key.sh "$RUNNER_TEMP/key" > /dev/null
            cp "$RUNNER_TEMP/key/android.keystore" android.keystore
            password=$(cat "$RUNNER_TEMP/key/password.txt")
            echo "::add-mask::$password"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=a throwaway key (not for Google Play)" >> "$GITHUB_ENV"
          fi
      - name: Version
        run: |
          # Google Play wants a higher version code with every upload: the run's number,
          # above anything uploaded by hand before.
          code=$((1000 + ${{ github.run_number }}))
          python3 - "$code" <<'PY'
          import json, sys
          manifest = json.load(open("twa-manifest.json"))
          manifest["appVersionCode"] = int(sys.argv[1])
          json.dump(manifest, open("twa-manifest.json", "w"), indent=2)
          PY
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: bubblewrap update --skipVersionUpgrade
      - name: Build
        run: bubblewrap build --skipPwaValidation
      - name: Summary
        run: |
          ls -la *.aab *.apk
          fingerprint=$(keytool -list -v -keystore android.keystore -alias android \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | sed -n 's/^\s*SHA256: //p')
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt" dump badging app-release-signed.apk)
          {
            echo "### Android app, version code $VERSION_CODE"
            echo "- Signed with: $SIGNED_WITH"
            echo "- Signing certificate, SHA-256: \`$fingerprint\`"
            echo "- Package: $(echo "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            echo "- Minimum Android API level: $(echo "$badging" | grep -oE "^(minSdkVersion|sdkVersion):'[0-9]+'" | grep -oE '[0-9]+')"
            echo "- Target Android API level: $(echo "$badging" | sed -n "s/^targetSdkVersion:'\(.*\)'/\1/p")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: |
            mobile/android/app-release-bundle.aab
            mobile/android/app-release-signed.apk
          if-no-files-found: error
