<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swiss Ride Share — Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>🚗 Swiss Ride Share</h1>
  <span class="subtitle">prototype — drives + public transport, corridor-matched</span>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="post">Post a Drive</button>
  <button class="tab-btn" data-view="request">Request a Ride</button>
  <button class="tab-btn" data-view="browse">Browse Drives</button>
</nav>

<main>
  <div class="panel">

    <!-- POST A DRIVE -->
    <section id="view-post" class="view active">
      <label for="post-driver-name">Your name</label>
      <input type="text" id="post-driver-name" placeholder="e.g. Jean" />

      <label>Origin</label>
      <div class="point-picker">
        <button type="button" id="pick-post-origin" data-role="post-origin">Pick on map</button>
        <input type="text" id="name-post-origin" placeholder="place name" />
      </div>
      <div class="coord-readout" id="readout-post-origin">not set</div>

      <label>Destination</label>
      <div class="point-picker">
        <button type="button" id="pick-post-destination" data-role="post-destination">Pick on map</button>
        <input type="text" id="name-post-destination" placeholder="place name" />
      </div>
      <div class="coord-readout" id="readout-post-destination">not set</div>

      <label for="post-departure">Departure time</label>
      <input type="datetime-local" id="post-departure" />

      <label for="post-seats">Seats available</label>
      <input type="number" id="post-seats" min="1" max="8" value="3" />

      <button class="submit-btn" id="post-submit">Post drive</button>
      <div class="status-msg" id="post-status"></div>

      <div class="hint">Click "Pick on map" then click a point on the map to set origin/destination.</div>
    </section>

    <!-- REQUEST A RIDE -->
    <section id="view-request" class="view">
      <label for="req-passenger-name">Your name</label>
      <input type="text" id="req-passenger-name" placeholder="e.g. Marie" />

      <label>Origin</label>
      <div class="point-picker">
        <button type="button" id="pick-req-origin" data-role="req-origin">Pick on map</button>
        <input type="text" id="name-req-origin" placeholder="place name" />
      </div>
      <div class="coord-readout" id="readout-req-origin">not set</div>

      <label>Destination</label>
      <div class="point-picker">
        <button type="button" id="pick-req-destination" data-role="req-destination">Pick on map</button>
        <input type="text" id="name-req-destination" placeholder="place name" />
      </div>
      <div class="coord-readout" id="readout-req-destination">not set</div>

      <label for="req-time">Requested time</label>
      <input type="datetime-local" id="req-time" />

      <button class="submit-btn" id="req-submit">Find a ride</button>
      <div class="status-msg" id="req-status"></div>

      <div class="section-title">Driver matches</div>
      <div id="req-matches"><div class="empty-state">No search yet.</div></div>

      <div class="section-title">Public transport alternative</div>
      <div id="req-transit"><div class="empty-state">No search yet.</div></div>
    </section>

    <!-- BROWSE DRIVES -->
    <section id="view-browse" class="view">
      <div class="section-title">Upcoming drives</div>
      <button class="submit-btn" id="browse-refresh" style="margin-top:0;">Refresh</button>
      <div class="drive-list" id="browse-list"><div class="empty-state">Loading…</div></div>
    </section>

  </div>

  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
