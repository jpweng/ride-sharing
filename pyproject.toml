[project]
name = "ride-sharing"
version = "0.1.0"
description = "Swiss ride-share prototype: FastAPI backend + Leaflet frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.146.0",
    "requests==2.32.3",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
