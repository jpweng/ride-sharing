[project]
name = "ride-sharing"
version = "0.1.0"
description = "Swiss ride-share prototype: FastAPI backend + Leaflet frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.44.5",
    "fastapi==0.146.0",
    "pyjwt[crypto]==2.15.1",
    "requests==2.33.0",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
